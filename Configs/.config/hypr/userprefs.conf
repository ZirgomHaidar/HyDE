# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# Start My Applications at Startup
exec-once = sleep 4 && rog-control-center
exec-once = /home/haidar/.config/hypr/scripts/change-refresh-rate.sh

## Keybinds

unbind = $mainMod, Q, $d close focused window, exec, $scrPath/dontkillsteam.sh
bindd = $mainMod, Q, $d text editor , exec, $EDITOR
# bind = $mainMod, `, exec, enter

unbind = $mainMod, B, $d web browser , exec, $BROWSER
unbind = Alt, F4, $d close focused window, exec, $scrPath/dontkillsteam.sh
bindd = Alt, F4, $d logout menu, exec, $scrPath/logoutlaunch.sh
unbind = $mainMod, C, $d text editor , exec, $EDITOR
bindd = $mainMod, C, $d close focused window, exec, $scrPath/dontkillsteam.sh

# Apps
bindd = , XF86Launch1, $d terminal emulator , exec, $TERMINAL
bindd = Alt, XF86Launch1, $d dropdown terminal , exec, hyde-shell pypr toggle console
unbind = $mainMod, B, $d web browser , exec, $BROWSER
bindd = , F1, $d web browser , exec, $BROWSER
bindd = , F4, $d Launch Telegram , exec, Telegram
#bindd = , F3, $d Launch rmpc with mpd , exec, [float; move 15% 6%; size 70% 60%] $TERMINAL -e rmpc
bindd = , F3, $d Launch spotify , exec, spotify
bindd = Alt, e, $d Launch yazi file manager , exec, $TERMINAL -e yazi
bindd = Control Shift, z, $d Launch peaclock , exec, [float; move 32% 6%; size 570 211] $TERMINAL -e peaclock

# audio
unbind  = , F10, $d toggle mute output , exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
unbind = , F11, $d decrease volume , exec, $scrPath/volumecontrol.sh -o d # decrease volume
unbind = , F12, $d increase volume , exec, $scrPath/volumecontrol.sh -o i # increase volume

binddel = $mainMod, F3, $d decrease volume , exec, $scrPath/volumecontrol.sh -o d # decrease volume
binddel = $mainMod, F4, $d increase volume , exec, $scrPath/volumecontrol.sh -o i # increase volume

binddel = $mainMod, F2 , $d increase brightness , exec, $scrPath/brightnesscontrol.sh i # increase brightness
binddel = $mainMod, F1 , $d decrease brightness , exec, $scrPath/brightnesscontrol.sh d # decrease brightness


binddl  = , F7,$d play media, exec, playerctl play-pause # toggle between media play and pause
binddl  = , F8,$d next media  , exec, playerctl next # media next
binddl  = , F6,$d  previous media , exec, playerctl previous # media previous

# keyboard backlight
bind = , XF86KbdBrightnessDown, exec, brightnessctl --device='asus::kbd_backlight' set 0
bind = , XF86KbdBrightnessUP, exec, brightnessctl --device='asus::kbd_backlight' set 1

# Asus ROG Keybinds
bind = , XF86Launch4, exec, asusctl profile -n

# Screen Capture
unbind = $mainMod, P, $d snip screen , exec, $scrPath/screenshot.sh s # partial screenshot capture
unbind = $mainMod Control, P, $d freeze and snip screen, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
unbind = $mainMod Alt, P, $d print monitor , exec, $scrPath/screenshot.sh m # monitor screenshot capture
unbind = , Print, $d print all monitors , exec, $scrPath/screenshot.sh p # all monitors screenshot capture

bindd = , Print, $d freeze and snip screen, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
bindd = $mainMod , P, $d freeze and snip screen, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
binddl = $mainMod, Print, $d print monitor , exec, $scrPath/screenshot.sh m # monitor screenshot capture
binddl = $mainMod Alt, Print, $d print all monitors , exec, $scrPath/screenshot.sh p # all monitors screenshot capture

# Zen Browser config
windowrule = opacity 1 $& 1 $& 1,class:^(zen)$

